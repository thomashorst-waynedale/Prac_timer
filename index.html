<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gridiron Practice Suite</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase Modular SDK via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
      getAuth, signInAnonymously, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Replace with your Firebase project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Bind Firebase services globally to window
    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;
    window.onSnapshot = onSnapshot;
    window.collection = collection;
    window.addDoc = addDoc;

    // Anonymous Authentication Setup
    signInAnonymously(auth).catch((error) => {
      console.error("Auth Error:", error);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("Authenticated anonymously as:", user.uid);
        const datePicker = document.getElementById("practice-date-picker");
        const today = new Date().toISOString().split('T')[0];
        if (datePicker) {
          datePicker.value = today;
          window.switchPracticeDate(today);
        }
      }
    });
  </script>

  <!-- Print Optimization Stylesheet -->
  <style>
    @media print {
      body {
        background-color: white !important;
        color: black !important;
        font-family: Arial, sans-serif !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      header, #weather-bar, button, .no-print {
        display: none !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .practice-card {
        background-color: white !important;
        border: 1px solid #333 !important;
        color: black !important;
        box-shadow: none !important;
        padding: 6px 10px !important;
        margin-bottom: 6px !important;
        page-break-inside: avoid;
      }
      input {
        border: none !important;
        background: transparent !important;
        color: black !important;
        font-weight: bold !important;
        padding: 0 !important;
      }
      .tag-chip {
        border: 1px solid #666 !important;
        color: black !important;
        background: #f0f0f0 !important;
        font-size: 10px !important;
        padding: 1px 4px !important;
      }
      .print-header {
        display: block !important;
        border-bottom: 2px solid black;
        margin-bottom: 12px;
        padding-bottom: 4px;
      }
    }
    .print-header {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Printable Header (Visible only when printing) -->
  <div class="print-header flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black uppercase tracking-wider">PRACTICE PLAN</h1>
      <p id="print-date-display" class="text-sm font-bold text-gray-700"></p>
    </div>
    <div class="text-right">
      <span class="text-xs font-bold uppercase">Waynedale Middle School Football</span>
    </div>
  </div>

  <!-- Header Navigation -->
  <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 sticky top-0 z-50 flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center gap-2">
      <span class="text-xl">🏈</span>
      <h1 class="font-black text-lg text-amber-500 tracking-wider uppercase">Coach Hub</h1>
    </div>

    <!-- Controls & Actions -->
    <div class="flex items-center gap-2 flex-wrap">
      <!-- Date Selector -->
      <div class="flex items-center gap-2 bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-700">
        <label for="practice-date-picker" class="font-semibold text-xs text-gray-400 uppercase">Date:</label>
        <input 
          type="date" 
          id="practice-date-picker" 
          class="bg-transparent text-amber-400 font-bold text-sm focus:outline-none cursor-pointer"
          onchange="window.switchPracticeDate(this.value)"
        />
      </div>

      <!-- Template Actions -->
      <button 
        onclick="window.saveAsTemplatePrompt()" 
        class="bg-gray-700 hover:bg-gray-600 text-amber-400 font-bold px-3 py-1.5 rounded-lg text-xs uppercase tracking-wider transition border border-amber-500/30"
      >
        💾 Save Template
      </button>

      <button 
        onclick="window.loadTemplatePrompt()" 
        class="bg-gray-700 hover:bg-gray-600 text-amber-400 font-bold px-3 py-1.5 rounded-lg text-xs uppercase tracking-wider transition border border-amber-500/30"
      >
        📂 Load Template
      </button>

      <!-- Print Button -->
      <button 
        onclick="window.print()" 
        class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-black px-3 py-1.5 rounded-lg text-xs tracking-wider uppercase transition shadow-md"
      >
        🖨️ Print Plan
      </button>

      <!-- Injury Pause -->
      <button 
        onclick="window.toggleInjuryTimeout()" 
        id="injury-btn"
        class="bg-red-600 hover:bg-red-700 text-white font-extrabold px-3 py-1.5 rounded-lg text-xs tracking-wider uppercase transition shadow-md"
      >
        🚨 Injury Timeout
      </button>
    </div>
  </header>

  <!-- Weather & Hydration Alert Bar -->
  <div id="weather-bar" class="bg-amber-950 border-b border-amber-800/50 px-4 py-2 flex items-center justify-between text-xs text-amber-200">
    <div class="flex items-center gap-2">
      <span id="weather-temp" class="font-bold">--°F</span>
      <span class="text-amber-500">|</span>
      <span id="hydration-status" class="font-medium">OHSAA Hydration Rules Active</span>
    </div>
    <span class="text-amber-400/60 text-[10px]">Middle School Staff Sync</span>
  </div>

  <!-- Main Schedule Canvas -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-3">
    <div id="schedule-container" class="space-y-2">
      <!-- Dynamic Periods Rendered Here -->
    </div>

    <!-- Add Period Button -->
    <button 
      onclick="window.addNewPeriod()" 
      class="no-print w-full py-2.5 border-2 border-dashed border-gray-700 hover:border-amber-500 text-gray-400 hover:text-amber-400 font-bold rounded-xl transition text-xs uppercase tracking-wider flex items-center justify-center gap-2"
    >
      <span>+</span> Add Practice Block
    </button>
  </main>

  <!-- Global Application Logic -->
  <script>
    window.MASTER_DRILL_BANK = {
      "Warm Up": ["Dynamic Warmup", "High Knees / Butt Kicks", "Form Running & Striders"],
      "Blood Pumper": ["Take Off & Read", "Pursuit & Swarm", "Oklahoma / Fast Alignment"],
      "Indy / Group": ["Drive & Lock Out", "Board Get-Offs", "Get-Off & Hoop Rush", "High Knees & Bags", "Stalk Blocking", "Line Catching", "W-Drill Backpedal"],
      "Stations / Team Build": ["Hit, Wrap & Lift", "Profile Angle Tackle", "Block Shed & Tackle", "The Gauntlet", "Scoop & Score"],
      "Group / Team": ["7v7 / Inside Run Split", "Pursuit & Swarm", "Team Shell - Blitz Pickup", "Red Zone Efficiency"],
      "Conditioning": ["10 10s", "Gassers", "Fartlek", "Champions"],
      "Team Announcements": ["Game Prep", "Equipment Check", "Next Practice Info", "Parent/Roster Reminders"]
    };

    function getDefaultPeriods() {
      return [
        { id: 1, title: "Warm Up", duration: 10, notes: "Dynamic stretch & lines", options: ["Dynamic Warmup"] },
        { id: 2, title: "Blood Pumper", duration: 5, notes: "Fast pace alignment test", options: ["Pursuit & Swarm"] },
        { id: 3, title: "Indy / Group", duration: 20, notes: "Position-specific fundamentals", options: ["Drive & Lock Out", "W-Drill Backpedal"] },
        { id: 4, title: "Stations / Team Build", duration: 15, notes: "Tackling & turnover safety circuit", options: ["Hit, Wrap & Lift"] },
        { id: 5, title: "Group / Team", duration: 20, notes: "Game script execution", options: ["7v7 / Inside Run Split"] },
        { id: 6, title: "Conditioning", duration: 10, notes: "Finish strong", options: ["Gassers"] }
      ];
    }

    window.currentPracticeDate = new Date().toISOString().split('T')[0];
    window.periods = getDefaultPeriods();
    window.activeDateUnsubscribe = null;
    window.isInjuryPaused = false;

    // Switch and Sync Date-Based Plans
    window.switchPracticeDate = function(dateStr) {
      if (!dateStr) return;
      window.currentPracticeDate = dateStr;

      const printDisplay = document.getElementById("print-date-display");
      if (printDisplay) printDisplay.innerText = `Date: ${dateStr}`;

      if (window.activeDateUnsubscribe) {
        window.activeDateUnsubscribe();
      }

      if (!window.db || !window.doc || !window.onSnapshot) return;

      const docRef = window.doc(window.db, "artifacts", "prac-planner", "public", "data", "practice_plans", dateStr);

      window.activeDateUnsubscribe = window.onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          window.periods = data.periods || [];
        } else {
          window.periods = getDefaultPeriods();
          window.savePracticeForDate(dateStr);
        }
        renderSchedule();
      }, (err) => {
        console.error("Error syncing date plan:", err);
      });
    };

    // Save Active Plan to Cloud
    window.savePracticeForDate = async function(dateStr) {
      if (!window.db || !window.doc || !window.setDoc) return;

      const dateKey = dateStr || window.currentPracticeDate;
      const practiceData = {
        date: dateKey,
        periods: window.periods,
        lastUpdated: new Date().toISOString()
      };

      try {
        const docRef = window.doc(window.db, "artifacts", "prac-planner", "public", "data", "practice_plans", dateKey);
        await window.setDoc(docRef, practiceData, { merge: true });
      } catch (err) {
        console.error("Error saving practice plan:", err);
      }
    };

    // Template System: Save current schedule layout as named template
    window.saveAsTemplatePrompt = async function() {
      const templateName = prompt("Enter a name for this practice template:\n(e.g., 'Full Pads Day', 'Light Walkthrough', 'Thursday Pre-Game')");
      if (!templateName || !templateName.trim()) return;

      if (!window.db || !window.doc || !window.setDoc) return;

      try {
        const templateRef = window.doc(window.db, "artifacts", "prac-planner", "public", "data", "templates", templateName.trim());
        await window.setDoc(templateRef, {
          name: templateName.trim(),
          periods: window.periods,
          savedAt: new Date().toISOString()
        });
        alert(`Template "${templateName.trim()}" saved successfully!`);
      } catch (err) {
        console.error("Error saving template:", err);
      }
    };

    // Template System: Load existing template into current date
    window.loadTemplatePrompt = async function() {
      const templateName = prompt("Enter the exact name of the template to load:\n(e.g., 'Full Pads Day', 'Light Walkthrough')");
      if (!templateName || !templateName.trim()) return;

      if (!window.db || !window.doc || !window.getDoc) return;

      try {
        const templateRef = window.doc(window.db, "artifacts", "prac-planner", "public", "data", "templates", templateName.trim());
        const docSnap = await window.getDoc(templateRef);

        if (docSnap.exists()) {
          window.periods = docSnap.data().periods || [];
          renderSchedule();
          window.savePracticeForDate(window.currentPracticeDate);
          alert(`Loaded template "${templateName.trim()}" into current practice!`);
        } else {
          alert(`No template found named "${templateName.trim()}".`);
        }
      } catch (err) {
        console.error("Error loading template:", err);
      }
    };

    // Add Drill / Tag Selector Prompt
    window.addDrillOptionPrompt = function(idx) {
      const currentTitle = window.periods[idx].title;
      const availableDrills = window.MASTER_DRILL_BANK[currentTitle] || [
        "Hit, Wrap & Lift", "Drive & Lock Out", "Get-Off & Hoop Rush", "High Knees & Bags", "Stalk Blocking"
      ];

      const selection = prompt(
        `Select or type a drill tag for ${currentTitle}:\n\nSuggestions:\n• ` + availableDrills.join("\n• ")
      );

      if (selection && selection.trim()) {
        const tag = selection.trim();
        if (!window.periods[idx].options) window.periods[idx].options = [];
        window.periods[idx].options.push(tag);
        
        renderSchedule();
        window.savePracticeForDate(window.currentPracticeDate);
      }
    };

    // Render Function
    function renderSchedule() {
      const container = document.getElementById("schedule-container");
      if (!container) return;

      container.innerHTML = "";

      window.periods.forEach((period, idx) => {
        const card = document.createElement("div");
        card.className = "practice-card bg-gray-800 border border-gray-700 rounded-xl p-3 shadow-sm hover:border-gray-600 transition";

        const tagsHtml = (period.options || []).map(opt => `
          <span class="tag-chip inline-block bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-2 py-0.5 rounded font-semibold mr-1 mb-1">
            ${opt}
          </span>
        `).join("");

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-1">
            <div class="flex items-center gap-2">
              <span class="text-xs font-black text-gray-500 w-4">#${idx + 1}</span>
              <input 
                type="text" 
                value="${period.title}" 
                onchange="window.updatePeriodTitle(${idx}, this.value)"
                class="bg-transparent font-bold text-white text-sm focus:outline-none focus:border-b border-amber-500"
              />
            </div>
            <div class="flex items-center gap-1">
              <input 
                type="number" 
                value="${period.duration}" 
                onchange="window.updatePeriodDuration(${idx}, this.value)"
                class="w-10 text-center bg-gray-900 text-amber-400 font-bold py-0.5 rounded border border-gray-700 text-xs focus:outline-none"
              />
              <span class="text-xs text-gray-400 font-medium">min</span>
            </div>
          </div>

          <div class="mb-2">
            <input 
              type="text" 
              placeholder="Add practice notes or coaching points..." 
              value="${period.notes || ''}" 
              onchange="window.updatePeriodNotes(${idx}, this.value)"
              class="w-full bg-gray-900/50 text-gray-300 text-xs p-1.5 rounded border border-gray-700/50 focus:outline-none"
            />
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-gray-700/40">
            <div class="flex flex-wrap items-center">
              ${tagsHtml}
              <button 
                onclick="window.addDrillOptionPrompt(${idx})" 
                class="no-print text-[11px] text-amber-500 hover:text-amber-400 font-bold px-1.5 py-0.5 rounded border border-amber-500/30 hover:border-amber-500 transition mb-1"
              >
                + Tag Drill
              </button>
            </div>
            <button 
              onclick="window.removePeriod(${idx})" 
              class="no-print text-gray-500 hover:text-red-400 text-xs px-1 py-0.5 transition"
            >
              Delete
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Schedule Mutation Helpers
    window.updatePeriodTitle = function(idx, val) {
      window.periods[idx].title = val;
      window.savePracticeForDate(window.currentPracticeDate);
    };

    window.updatePeriodDuration = function(idx, val) {
      window.periods[idx].duration = parseInt(val) || 0;
      window.savePracticeForDate(window.currentPracticeDate);
    };

    window.updatePeriodNotes = function(idx, val) {
      window.periods[idx].notes = val;
      window.savePracticeForDate(window.currentPracticeDate);
    };

    window.addNewPeriod = function() {
      window.periods.push({
        id: Date.now(),
        title: "Indy / Group",
        duration: 10,
        notes: "",
        options: []
      });
      renderSchedule();
      window.savePracticeForDate(window.currentPracticeDate);
    };

    window.removePeriod = function(idx) {
      window.periods.splice(idx, 1);
      renderSchedule();
      window.savePracticeForDate(window.currentPracticeDate);
    };

    window.toggleInjuryTimeout = function() {
      window.isInjuryPaused = !window.isInjuryPaused;
      const btn = document.getElementById("injury-btn");
      if (window.isInjuryPaused) {
        btn.innerText = "⏸️ INJURY PAUSED";
        btn.className = "bg-amber-600 hover:bg-amber-700 text-white font-extrabold px-3 py-1.5 rounded-lg text-xs tracking-wider uppercase transition shadow-md animate-pulse";
      } else {
        btn.innerText = "🚨 Injury Timeout";
        btn.className = "bg-red-600 hover:bg-red-700 text-white font-extrabold px-3 py-1.5 rounded-lg text-xs tracking-wider uppercase transition shadow-md";
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      renderSchedule();
    });
  </script>
</body>
</html>
